name: Build Signed APK

# Builds the Android release APK signed with the release keystore.
# The keystore + passwords come from repo secrets (ANDROID_KEYSTORE_BASE64 /
# ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD) and are
# decoded into src/android/keystore.properties at build time (gitignored).
# rclone.aar is a build artifact (deps/build_rclone_android.sh) — this workflow
# installs Go + gomobile and builds it before Gradle runs, so no prebuilt
# binaries are needed.

on:
  workflow_dispatch:
  push:
    branches:
      - feat/model-metadata-from-api
      - feat/model-list-search-from-api

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platforms;android-36
            build-tools;35.0.0
            platform-tools
            ndk;27.0.12077973
            cmake;3.22.1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build rclone.aar (gomobile)
        working-directory: deps
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.0.12077973"
          gomobile init
          bash build_rclone_android.sh
          mkdir -p ../src/android/app/libs
          cp build/rclone/rclone.aar ../src/android/app/libs/rclone.aar

      - name: Decode signing keystore
        working-directory: src/android
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
          chmod 600 release.keystore keystore.properties

      - name: Build release APK
        working-directory: src/android
        env:
          # [T-ci-side-by-side] Suffix the release applicationId with ".ci"
          # (see build.gradle.kts) so the CI APK installs side-by-side with
          # the production app instead of overwriting it.
          MINIS_CI_PACKAGE: "1"
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openminis-release-apk
          path: src/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error